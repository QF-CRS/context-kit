[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-kit"
version = "0.1.1"
description = "Safe, deterministic repository context bundles for code review and AI coding tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Context Kit contributors" }
]
keywords = ["developer-tools", "code-review", "onboarding", "ai-coding", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/QF-CRS/context-kit"
Repository = "https://github.com/QF-CRS/context-kit"
Issues = "https://github.com/QF-CRS/context-kit/issues"

[project.scripts]
context-kit = "contextkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextkit = ["py.typed"]
